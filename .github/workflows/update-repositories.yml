name: Refresh GitHub repository metadata

on:
  schedule:
    # Mondays at 09:23 Asia/Shanghai; GitHub schedules use UTC.
    - cron: '23 1 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/update-repositories.yml'
      - 'scripts/update_repositories.py'
      - 'tests/test_update_repositories.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -B -m unittest discover -s tests -p 'test_update_repositories.py' -v

  refresh:
    needs: test
    if: >-
      github.repository == 'phodal/awesome-iot' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: refresh-repository-metadata
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Ensure the default branch still matches the tested revision
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tested="$(git rev-parse HEAD)"
          current="$(git ls-remote --exit-code origin "refs/heads/${DEFAULT_BRANCH}" | cut -f1)"
          if [ "$current" != "$tested" ]; then
            echo "Default branch advanced; start a new workflow run to test its current revision."
            exit 1
          fi
      - name: Refresh stars and remove unavailable or archived repositories
        run: python -B scripts/update_repositories.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit only changed README metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md; then
            echo "Repository metadata is unchanged."
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'Refresh GitHub repository metadata' -m 'Changes:
          - Refresh existing GitHub star counts and remove unavailable or archived repository entries.
          - Preserve other README content, ordering, and activity-age values.

          Validation:
          - Pass the repository updater regression tests.
          - Read repository status and star counts from the GitHub API.
          - Pass git diff --check.'
          git push origin "HEAD:${DEFAULT_BRANCH}"
